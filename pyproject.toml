[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "udfkit"
version = "0.1.0"
description = "Write DVD-Video (UDF 1.02 + ISO 9660) and Blu-ray (UDF 2.50) disc images in pure Python"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "kajisho5" }]
keywords = ["udf", "iso9660", "dvd", "blu-ray", "disc image", "video_ts", "bdmv"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
  "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/kajisho5/udfkit"

[project.scripts]
udfkit = "udfkit.__main__:main"

[tool.setuptools]
packages = ["udfkit"]
